name: Web deployment checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        run: docker build -t lingjian-web:test .
      - name: Check authentication, editor, and deployment regressions
        run: >-
          docker run --rm -e LINGJIAN_ENV=development
          -e LINGJIAN_WEB_WORKSPACE=/tmp/test-workspace
          -v "$PWD/tests:/tests:ro" lingjian-web:test
          python -m unittest discover -s /tests -p 'test_web*.py'
      - name: Render a real video and restart within the free plan memory limit
        run: >-
          docker run --rm --cpus=1 --memory=512m
          -v "$PWD/tests:/tests:ro" lingjian-web:test
          python /tests/cloud_smoke.py
